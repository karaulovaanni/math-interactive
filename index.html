<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ваня • Математика, 3 класс</title>
<style>
:root{--ink:#242631;--muted:#747784;--line:#e7e8ed;--blue:#eef1ff;--pink:#fff0f4;--green:#edf7f0;--gold:#fff5e6;--purple:#6652b7;--ok:#228454;--bad:#b94a57}*{box-sizing:border-box}body{margin:0;background:#fafafd;color:var(--ink);font:16px/1.55 Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:28px 20px 60px}.hero{background:var(--blue);border-radius:20px;padding:24px 26px;margin-bottom:20px;position:relative}.hero h1{font-size:clamp(24px,4vw,34px);margin:0 0 5px}.hero p{margin:0;color:#626675}.pig{position:absolute;right:24px;top:24px;font-size:32px}.progressbox{background:white;border:1px solid var(--line);border-radius:15px;padding:15px 18px;margin-bottom:22px}.progressline{height:8px;background:#eeeef4;border-radius:8px;overflow:hidden;margin:8px 0}.progressline i{display:block;height:100%;width:0;background:#8472d4;transition:width .25s}.stats{color:var(--muted);font-size:14px}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:8px}.tab{border:0;border-radius:10px;background:#f0f0f5;padding:10px 14px;white-space:nowrap;font-weight:700;color:#555;cursor:pointer}.tab.active{background:#eae6fb;color:#5844a5}.section{display:none}.section.active{display:block}.sectionhead{display:flex;align-items:center;gap:13px;margin:12px 0 18px}.icon{width:43px;height:43px;display:grid;place-items:center;border-radius:12px;background:var(--tint);color:var(--accent);font-size:22px}.sectionhead h2{margin:0;font-size:22px}.task{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}.tasktop{display:flex;gap:10px;align-items:flex-start}.num{color:var(--accent);font-weight:700;min-width:28px}.prompt{flex:1;font-size:17px}.answer{display:flex;gap:9px;margin:14px 0 0 38px;align-items:center}.answer input{font:inherit;padding:9px 11px;border:1px solid #d9dbe3;border-radius:9px;min-width:0;flex:1;max-width:430px}.answer button,.hintbtn{border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:#eeeafb;color:#5844a5}.answer button:hover,.hintbtn:hover{filter:brightness(.97)}.hintbtn{margin:10px 0 0 38px;background:#f4f4f7;color:#61636c;font-size:14px}.result{margin:9px 0 0 38px;font-weight:700;min-height:0}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.hint{margin:10px 0 0 38px;padding:10px 12px;background:var(--gold);border-radius:9px;color:#624e35;display:none}.done{border-color:#c4e2d0}.footer{margin-top:28px;text-align:center;color:var(--muted);font-size:14px}.reset{background:transparent;border:0;text-decoration:underline;color:var(--muted);cursor:pointer;font:inherit}@media(max-width:560px){.wrap{padding:14px 12px 40px}.hero{padding:19px 18px}.pig{right:15px;top:16px}.answer{margin-left:0}.hintbtn,.result,.hint{margin-left:0}.task{padding:14px}.prompt{font-size:16px}}
</style></head><body><main class="wrap">
<header class="hero"><span class="pig" aria-hidden="true">🐷</span><h1>Математический квест</h1><p>Ваня · 3 класс · Петерсон</p></header>
<div class="progressbox"><strong>Мой результат</strong><div class="progressline"><i id="bar"></i></div><div class="stats" id="stats">Верно: 0 из 0 проверенных · Баллы: 0</div></div>
<nav class="tabs" id="tabs" aria-label="Разделы тренажёра"></nav><div id="content"></div>
<footer class="footer">Решай в своём темпе · за каждый верный ответ получаешь балл<br><button class="reset" id="reset">Начать заново</button></footer>
</main><script>
const sections=[
{title:'Умножение и деление на 10, 100, 1000',icon:'×',tint:'var(--blue)',accent:'#6652b7',tasks:[['Вычисли: 46 · 10','460'],['Вычисли: 230 · 100','23000'],['Вычисли: 8 · 1000','8000'],['Вычисли: 705 · 10','7050'],['Вычисли: 60 · 1000','60000'],['Вычисли: 940 : 10','94'],['Вычисли: 7200 : 100','72'],['Вычисли: 48 000 : 100','480'],['Вычисли: 305 000 : 1000','305'],['Вычисли: 90 000 : 10','9000']]},
{title:'Вставь пропущенное число',icon:'□',tint:'var(--green)',accent:'#27845d',tasks:[['37 · □ = 3700','100'],['□ · 1000 = 54 000','54'],['6800 : □ = 68','100'],['□ : 100 = 420','42000'],['90 · □ = 90 000','1000'],['7000 : □ = 700','10']]},
{title:'Найди и исправь ошибки',icon:'⌕',tint:'var(--gold)',accent:'#b87928',tasks:[['Исправь равенство: 540 · 100 = 5400','54000'],['Исправь равенство: 48 000 : 100 = 48','480'],['Исправь равенство: 700 · 10 = 700','7000'],['Исправь равенство: 90 000 : 1000 = 900','90']]},
{title:'Сложи удобным способом',icon:'+',tint:'var(--pink)',accent:'#b55375',tasks:[['38 + 27 + 62 = ?','127'],['46 + 15 + 54 + 85 = ?','200'],['125 + 48 + 75 + 52 = ?','300'],['199 + 36 + 1 + 64 = ?','300'],['240 + 135 + 60 + 65 = ?','500'],['87 + 149 + 13 + 51 = ?','300']]},
{title:'Умножь удобным способом',icon:'×',tint:'var(--green)',accent:'#27845d',tasks:[['2 · 9 · 5 = ?','90'],['5 · 16 · 2 = ?','160'],['4 · 7 · 25 = ?','700'],['25 · 9 · 4 = ?','900'],['50 · 13 · 2 = ?','1300'],['2 · 34 · 5 = ?','340'],['5 · 6 · 2 · 3 = ?','180'],['4 · 11 · 5 · 5 = ?','1100'],['25 · 3 · 4 · 2 = ?','600'],['2 · 15 · 5 · 6 = ?','900']]},
{title:'Что обозначает буква?',icon:'a',tint:'var(--blue)',accent:'#6652b7',tasks:[['В коробке a карандашей. Как записать: на 6 карандашей больше?','a+6'],['В коробке a карандашей. Как записать: на 6 карандашей меньше?','a-6'],['В коробке a карандашей. Как записать: в 6 таких коробках?','a*6'],['В коробке a карандашей. Как записать: разделили поровну на 6?','a/6'],['У Вани m наклеек, у Пети n. У Вани больше. Как записать, сколько у них вместе?','m+n'],['Как записать, на сколько у Вани больше наклеек?','m-n'],['Как записать в 2 раза больше m наклеек?','m*2'],['В банке b кг мёда. Сколько кг в 4 таких банках?','b*4'],['В 4 банках по b кг мёда, 2 кг съели. Сколько осталось?','b*4-2']]},
{title:'Составь выражение',icon:'✎',tint:'var(--gold)',accent:'#b87928',tasks:[['В пачке a листов. Сколько листов в 5 пачках?','a*5'],['Было b карандашей, взяли 8. Сколько осталось?','b-8'],['У Маши c бусин, у Оли на 7 больше. Сколько у Оли?','c+7'],['У Коли d машинок, у Вани в 3 раза больше. Сколько у Вани?','d*3'],['m конфет поровну разложили в 4 пакета. Сколько в каждом?','m/4'],['В одной коробке x кубиков, в другой y. Сколько всего?','x+y'],['3 тетради по a рублей и ручка за 12 рублей. Сколько стоит покупка?','a*3+12'],['В 4 банках по b кг варенья, съели c кг. Сколько осталось?','b*4-c'],['Было n яблок. 3 отложили, остальные поделили поровну между двумя детьми. Сколько получил каждый?','(n-3)/2'],['В одной коробке a деталей, во второй в 2 раза больше. Сколько всего?','a+a*2']]},
{title:'Подставь число и вычисли',icon:'=',tint:'var(--pink)',accent:'#b55375',tasks:[['a + 28, если a = 47','75'],['90 - b, если b = 36','54'],['c · 4, если c = 23','92'],['d : 6, если d = 84','14'],['5 · m · 2, если m = 17','170'],['4 · n · 25, если n = 8','800'],['a · 3 + b, если a = 12, b = 19','55'],['(x - y) : 4, если x = 68, y = 20','12']]},
{title:'Выбери подходящее выражение',icon:'✓',tint:'var(--green)',accent:'#27845d',tasks:[['Красных кубиков a, синих в 4 раза больше. Сколько синих? Введи номер: 1) a+4; 2) a·4; 3) a:4','2'],['Было b яблок, осталось 9. Сколько съели? 1) b+9; 2) 9-b; 3) b-9','3'],['3 альбома по c рублей и краски за 40 рублей. Сколько заплатили? 1) c·3+40; 2) (c+40)·3; 3) c+3+40','1'],['m+n карандашей раздали поровну 5 детям. Сколько получил каждый? Введи номер: 1) m+n:5; 2) (m+n):5; 3) (m-n):5','2']]},
{title:'Задачи на приведение к единице',icon:'▣',tint:'var(--blue)',accent:'#6652b7',tasks:[['В 4 коробках 48 карандашей. Сколько карандашей в 7 таких коробках?','84'],['3 тетради стоят 54 рубля. Сколько стоят 8 таких тетрадей?','144'],['Из 5 м ткани сшили 10 сумок. Сколько сумок можно сшить из 8 м?','16'],['Для 6 кормушек нужно 42 дощечки. Сколько кормушек можно сделать из 63 дощечек?','9'],['В 4 банках 12 кг мёда. Сколько таких банок нужно для 27 кг?','9'],['В 3 корзинах 24 кг яблок. Сколько кг поместится в 5 таких корзинах?','40']]},
{title:'Буква в задаче',icon:'☆',tint:'var(--pink)',accent:'#b55375',tasks:[['В 3 коробках 36 карандашей. Составь выражение для количества карандашей в a коробках. Запиши: число перед a, затем знак * и a.','12*a'],['При a = 5, сколько карандашей в коробках?','60'],['При a = 8, сколько карандашей в коробках?','96'],['За 4 блокнота заплатили b рублей. Составь выражение для цены 7 блокнотов. Запиши: число перед b, затем * и b.','7*b'],['Если b = 80, сколько стоят 7 блокнотов?','140'],['В 5 банках 15 л сока. Сколько банок нужно для c литров? Запиши выражение, используя c.','c/3'],['При c = 24, сколько потребуется банок?','8'],['При c = 36, сколько потребуется банок?','12'],['Было m деталей. Для 4 построек взяли по 9 деталей. Составь выражение для остатка.','m-36'],['Если m = 60, сколько деталей осталось?','24']]},
{title:'Умножение в столбик',icon:'×',tint:'var(--gold)',accent:'#b87928',tasks:[['Вычисли: 24 · 7','168'],['Вычисли: 38 · 6','228'],['Вычисли: 57 · 4','228'],['Вычисли: 86 · 3','258'],['Вычисли: 126 · 5','630'],['Вычисли: 208 · 4','832']]}
];
const root=document.getElementById('content'),tabs=document.getElementById('tabs');let checked=0,correct=0,points=0;
function norm(s){return s.toLowerCase().replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/\s/g,'').replace(/,/g,'.').replace(/\*/g,'*').replace(/\(([^()]*)\)/g,'$1')}
function update(){document.getElementById('stats').textContent=`Верно: ${correct} из ${checked} проверенных · Баллы: ${points}`;document.getElementById('bar').style.width=(checked?Math.round(correct/checked*100):0)+'%'}
function check(card,ans){if(card.dataset.checked)return;card.dataset.checked='1';checked++;let input=card.querySelector('input'),r=card.querySelector('.result'),ok=norm(input.value)===norm(ans);if(ok){correct++;points++;card.classList.add('done');r.textContent='Верно! Отличная работа ✨';r.className='result ok'}else{r.textContent='Пока не совпало. Попробуй ещё раз или открой подсказку.';r.className='result bad'}update()}
sections.forEach((s,si)=>{let b=document.createElement('button');b.className='tab'+(!si?' active':'');b.textContent=`${si+1}. ${s.title}`;b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('sec'+si).classList.add('active')};tabs.appendChild(b);
let sec=document.createElement('section');sec.className='section'+(!si?' active':'');sec.id='sec'+si;sec.style.setProperty('--tint',s.tint);sec.style.setProperty('--accent',s.accent);sec.innerHTML=`<div class="sectionhead"><span class="icon">${s.icon}</span><h2>${s.title}</h2></div>`;
s.tasks.forEach(([q,a],ti)=>{let card=document.createElement('article');card.className='task';let safe=q.replaceAll('&','&amp;').replaceAll('<','&lt;');card.innerHTML=`<div class="tasktop"><span class="num">${ti+1}.</span><div class="prompt">${safe}</div></div><div class="answer"><input aria-label="Ответ на задание ${ti+1}" autocomplete="off"><button type="button">Проверить</button></div><div class="result" aria-live="polite"></div><button class="hintbtn" type="button">Показать ответ</button><div class="hint">Ответ: <strong>${a}</strong></div>`;card.querySelector('button').onclick=()=>check(card,a);card.querySelector('input').addEventListener('keydown',e=>{if(e.key==='Enter')check(card,a)});card.querySelector('.hintbtn').onclick=()=>{let h=card.querySelector('.hint');h.style.display=h.style.display==='block'?'none':'block'};sec.appendChild(card)});root.appendChild(sec)});
document.getElementById('reset').onclick=()=>{checked=0;correct=0;points=0;document.querySelectorAll('.task').forEach(c=>{delete c.dataset.checked;c.classList.remove('done');c.querySelector('input').value='';c.querySelector('.result').textContent='';c.querySelector('.result').className='result';c.querySelector('.hint').style.display='none'});update()};
</script></body></html>
