<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ваня • Математика, 3 класс</title>
<style>
:root{--ink:#292d38;--muted:#697184;--line:#e5e8f0;--blue:#eef2ff;--pink:#fff0f4;--green:#edf7f0;--gold:#fff5e6;--purple:#6652b7;--ok:#228454;--bad:#b94a57}*{box-sizing:border-box}body{margin:0;background:#fafafd;color:var(--ink);font:17px/1.55 Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:24px 20px 55px}.hero{background:#eef2ff;border-radius:12px;padding:13px 18px;margin-bottom:18px;color:#59657e;font-size:22px}.progressbox{background:white;border:1px solid var(--line);border-radius:13px;padding:14px 17px;margin-bottom:20px}.progress-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.progressline{height:8px;background:#eeeef4;border-radius:8px;overflow:hidden;margin:9px 0}.progressline i{display:block;height:100%;width:0;background:#8472d4;transition:width .25s}.stats{color:var(--muted);font-size:14px}.reset{border:0;border-radius:9px;background:#f1effb;color:#5844a5;padding:9px 13px;font:600 14px Arial;cursor:pointer}.task{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin:12px 0}.task-meta{color:var(--muted);font-size:14px;margin-bottom:12px}.prompt{font-size:21px;font-weight:600;min-height:56px}.answer{display:flex;gap:10px;margin-top:18px;align-items:center}.answer input{font:inherit;padding:11px 13px;border:1px solid #d9dbe3;border-radius:10px;min-width:0;flex:1;max-width:460px}.answer button,.next,.hintbtn,.tile-action{border:0;border-radius:10px;padding:11px 16px;font:600 15px Arial;cursor:pointer;background:#eeeafb;color:#5844a5}.answer button:hover,.next:hover,.hintbtn:hover,.tile-action:hover{filter:brightness(.97)}.result{margin-top:12px;font-weight:700;min-height:24px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.hint{margin-top:10px;padding:10px 12px;background:var(--gold);border-radius:9px;color:#624e35}.task-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.hintbtn{background:#f4f4f7;color:#61636c;font-size:14px;padding:9px 13px}.next{display:none;background:#6652b7;color:white;margin-left:auto}.next.show{display:inline-block}.builder{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.builder-label{color:var(--muted);font-size:14px;margin-bottom:10px}.dropzone{min-height:50px;border:2px dashed #d9d5ee;border-radius:11px;background:#fcfbff;padding:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:#8b8b99}.dropzone.filled{color:var(--ink)}.tilebank{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tile{min-width:38px;padding:7px 10px;border:1px solid #e1deef;border-radius:9px;background:#f4f1ff;color:#5749a0;font-weight:700;text-align:center;cursor:grab;user-select:none;touch-action:manipulation}.tile:active{cursor:grabbing}.tile-action{padding:7px 11px;font-size:13px}.footer{margin-top:20px;color:var(--muted);font-size:14px}@media(max-width:560px){.wrap{padding:12px}.hero{font-size:20px}.task{padding:17px}.prompt{font-size:19px}.answer{align-items:stretch}.answer input{max-width:none}.tile{min-width:42px}}
</style></head><body><main class="wrap">
<header class="hero">Ваня · 3 класс · Петерсон</header>
<div class="progressbox"><div class="progress-head"><strong id="stepLabel">Задание 1</strong><button class="reset" id="reset">Сбросить прогресс</button></div><div class="progressline"><i id="bar"></i></div><div class="stats" id="stats">Верно: 0 · Баллы: 0</div></div>
<div id="content"></div><footer class="footer">Решай в своём темпе · верный ответ открывает следующее задание</footer>
</main><script>
const sections=[
{title:'Умножение и деление на 10, 100, 1000',icon:'×',tint:'var(--blue)',accent:'#6652b7',tasks:[['Вычисли: 46 · 10','460'],['Вычисли: 230 · 100','23000'],['Вычисли: 8 · 1000','8000'],['Вычисли: 705 · 10','7050'],['Вычисли: 60 · 1000','60000'],['Вычисли: 940 : 10','94'],['Вычисли: 7200 : 100','72'],['Вычисли: 48 000 : 100','480'],['Вычисли: 305 000 : 1000','305'],['Вычисли: 90 000 : 10','9000']]},
{title:'Вставь пропущенное число',icon:'□',tint:'var(--green)',accent:'#27845d',tasks:[['37 · □ = 3700','100'],['□ · 1000 = 54 000','54'],['6800 : □ = 68','100'],['□ : 100 = 420','42000'],['90 · □ = 90 000','1000'],['7000 : □ = 700','10']]},
{title:'Найди и исправь ошибки',icon:'⌕',tint:'var(--gold)',accent:'#b87928',tasks:[['Исправь равенство: 540 · 100 = 5400','54000'],['Исправь равенство: 48 000 : 100 = 48','480'],['Исправь равенство: 700 · 10 = 700','7000'],['Исправь равенство: 90 000 : 1000 = 900','90']]},
{title:'Сложи удобным способом',icon:'+',tint:'var(--pink)',accent:'#b55375',tasks:[['38 + 27 + 62 = ?','127'],['46 + 15 + 54 + 85 = ?','200'],['125 + 48 + 75 + 52 = ?','300'],['199 + 36 + 1 + 64 = ?','300'],['240 + 135 + 60 + 65 = ?','500'],['87 + 149 + 13 + 51 = ?','300']]},
{title:'Умножь удобным способом',icon:'×',tint:'var(--green)',accent:'#27845d',tasks:[['2 · 9 · 5 = ?','90'],['5 · 16 · 2 = ?','160'],['4 · 7 · 25 = ?','700'],['25 · 9 · 4 = ?','900'],['50 · 13 · 2 = ?','1300'],['2 · 34 · 5 = ?','340'],['5 · 6 · 2 · 3 = ?','180'],['4 · 11 · 5 · 5 = ?','1100'],['25 · 3 · 4 · 2 = ?','600'],['2 · 15 · 5 · 6 = ?','900']]},
{title:'Что обозначает буква?',icon:'a',tint:'var(--blue)',accent:'#6652b7',tasks:[['В коробке a карандашей. Как записать: на 6 карандашей больше?','a+6'],['В коробке a карандашей. Как записать: на 6 карандашей меньше?','a-6'],['В коробке a карандашей. Как записать: в 6 таких коробках?','a*6'],['В коробке a карандашей. Как записать: разделили поровну на 6?','a/6'],['У Вани m наклеек, у Пети n. У Вани больше. Как записать, сколько у них вместе?','m+n'],['Как записать, на сколько у Вани больше наклеек?','m-n'],['Как записать в 2 раза больше m наклеек?','m*2'],['В банке b кг мёда. Сколько кг в 4 таких банках?','b*4'],['В 4 банках по b кг мёда, 2 кг съели. Сколько осталось?','b*4-2']]},
{title:'Составь выражение',icon:'✎',tint:'var(--gold)',accent:'#b87928',tasks:[['В пачке a листов. Сколько листов в 5 пачках?','a*5'],['Было b карандашей, взяли 8. Сколько осталось?','b-8'],['У Маши c бусин, у Оли на 7 больше. Сколько у Оли?','c+7'],['У Коли d машинок, у Вани в 3 раза больше. Сколько у Вани?','d*3'],['m конфет поровну разложили в 4 пакета. Сколько в каждом?','m/4'],['В одной коробке x кубиков, в другой y. Сколько всего?','x+y'],['3 тетради по a рублей и ручка за 12 рублей. Сколько стоит покупка?','a*3+12'],['В 4 банках по b кг варенья, съели c кг. Сколько осталось?','b*4-c'],['Было n яблок. 3 отложили, остальные поделили поровну между двумя детьми. Сколько получил каждый?','(n-3)/2'],['В одной коробке a деталей, во второй в 2 раза больше. Сколько всего?','a+a*2']]},
{title:'Подставь число и вычисли',icon:'=',tint:'var(--pink)',accent:'#b55375',tasks:[['a + 28, если a = 47','75'],['90 - b, если b = 36','54'],['c · 4, если c = 23','92'],['d : 6, если d = 84','14'],['5 · m · 2, если m = 17','170'],['4 · n · 25, если n = 8','800'],['a · 3 + b, если a = 12, b = 19','55'],['(x - y) : 4, если x = 68, y = 20','12']]},
{title:'Выбери подходящее выражение',icon:'✓',tint:'var(--green)',accent:'#27845d',tasks:[['Красных кубиков a, синих в 4 раза больше. Сколько синих? Введи номер: 1) a+4; 2) a·4; 3) a:4','2'],['Было b яблок, осталось 9. Сколько съели? 1) b+9; 2) 9-b; 3) b-9','3'],['3 альбома по c рублей и краски за 40 рублей. Сколько заплатили? 1) c·3+40; 2) (c+40)·3; 3) c+3+40','1'],['m+n карандашей раздали поровну 5 детям. Сколько получил каждый? Введи номер: 1) m+n:5; 2) (m+n):5; 3) (m-n):5','2']]},
{title:'Задачи на приведение к единице',icon:'▣',tint:'var(--blue)',accent:'#6652b7',tasks:[['В 4 коробках 48 карандашей. Сколько карандашей в 7 таких коробках?','84'],['3 тетради стоят 54 рубля. Сколько стоят 8 таких тетрадей?','144'],['Из 5 м ткани сшили 10 сумок. Сколько сумок можно сшить из 8 м?','16'],['Для 6 кормушек нужно 42 дощечки. Сколько кормушек можно сделать из 63 дощечек?','9'],['В 4 банках 12 кг мёда. Сколько таких банок нужно для 27 кг?','9'],['В 3 корзинах 24 кг яблок. Сколько кг поместится в 5 таких корзинах?','40']]},
{title:'Буква в задаче',icon:'☆',tint:'var(--pink)',accent:'#b55375',tasks:[['В 3 коробках 36 карандашей. Составь выражение для количества карандашей в a коробках. Запиши: число перед a, затем знак * и a.','12*a'],['При a = 5, сколько карандашей в коробках?','60'],['При a = 8, сколько карандашей в коробках?','96'],['За 4 блокнота заплатили b рублей. Составь выражение для цены 7 блокнотов. Запиши: число перед b, затем * и b.','7*b'],['Если b = 80, сколько стоят 7 блокнотов?','140'],['В 5 банках 15 л сока. Сколько банок нужно для c литров? Запиши выражение, используя c.','c/3'],['При c = 24, сколько потребуется банок?','8'],['При c = 36, сколько потребуется банок?','12'],['Было m деталей. Для 4 построек взяли по 9 деталей. Составь выражение для остатка.','m-36'],['Если m = 60, сколько деталей осталось?','24']]},
{title:'Умножение в столбик',icon:'×',tint:'var(--gold)',accent:'#b87928',tasks:[['Вычисли: 24 · 7','168'],['Вычисли: 38 · 6','228'],['Вычисли: 57 · 4','228'],['Вычисли: 86 · 3','258'],['Вычисли: 126 · 5','630'],['Вычисли: 208 · 4','832']]}
];
const root=document.getElementById('content');
const tasks=sections.flatMap(section=>section.tasks.map(([prompt,answer])=>({section:section.title,prompt,answer})));
const storeKey='vanya-peterson-math-progress-v2';
let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){saved={}}
let current=Math.max(0,Math.min(tasks.length,Number(saved.current)||0));
let points=Math.max(0,Number(saved.points)||0);
let correctIds=Array.isArray(saved.correctIds)?saved.correctIds:[];
function norm(s){return s.toLowerCase().replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/\s/g,'').replace(/,/g,'.').replace(/\(([^()]*)\)/g,'$1')}
function persist(){localStorage.setItem(storeKey,JSON.stringify({current,points,correctIds}))}
function paintProgress(){document.getElementById('stepLabel').textContent=current<tasks.length?`Задание ${current+1} из ${tasks.length}`:'Все задания пройдены!';document.getElementById('stats').textContent=`Верно: ${correctIds.length} · Баллы: ${points}`;document.getElementById('bar').style.width=Math.round(current/tasks.length*100)+'%'}
function syncBuilder(){const input=root.querySelector('#answerInput');const dz=root.querySelector('.dropzone');if(!input||!dz)return;dz.textContent=input.value||'Перетащи сюда цифры и знаки';dz.classList.toggle('filled',!!input.value)}
function appendToken(token){const input=root.querySelector('#answerInput');if(!input||input.disabled)return;input.value+=token;syncBuilder();input.focus()}
function renderTask(){paintProgress();if(current>=tasks.length){root.innerHTML='<article class="task"><div class="prompt">🎉 Отличная работа! Ты прошёл все задания.</div><p>Можно сбросить прогресс и начать тренировку заново.</p></article>';return}
const t=tasks[current];root.innerHTML=`<article class="task" style="--accent:#6652b7"><div class="task-meta">${t.section} · задание ${current+1} из ${tasks.length}</div><div class="prompt">${t.prompt.replaceAll('&','&amp;').replaceAll('<','&lt;')}</div><div class="builder"><div class="builder-label">Собери ответ: перетащи знак или цифру в поле либо нажми на них</div><div class="dropzone" aria-label="Поле для сборки ответа">Перетащи сюда цифры и знаки</div><div class="answer"><input id="answerInput" aria-label="Твой ответ" autocomplete="off" inputmode="text"><button id="check" type="button">Проверить</button></div><div class="tilebank" aria-label="Цифры и знаки для ответа"></div><div class="task-actions"><button class="tile-action" id="backspace" type="button">⌫ Удалить знак</button><button class="tile-action" id="clear" type="button">Очистить поле</button><button class="hintbtn" id="hintButton" type="button">Показать ответ</button><button class="next" id="next" type="button">Следующее задание →</button></div><div class="result" id="result" aria-live="polite"></div><div class="hint" id="hint" hidden>Ответ: <strong>${t.answer}</strong></div></div></article>`;
const bank=root.querySelector('.tilebank');'0123456789+-*/():abc dmnxy'.replace(/ /g,'').split('').forEach(token=>{const el=document.createElement('button');el.type='button';el.className='tile';el.textContent=token==='*'?'×':token==='/'?':':token;el.draggable=true;el.setAttribute('aria-label',`Добавить ${token}`);el.addEventListener('click',()=>appendToken(token));el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',token));bank.appendChild(el)});
const dz=root.querySelector('.dropzone');dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('filled')});dz.addEventListener('drop',e=>{e.preventDefault();const token=e.dataTransfer.getData('text/plain');if(token)appendToken(token)});
const input=root.querySelector('#answerInput');input.addEventListener('input',syncBuilder);input.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});root.querySelector('#check').onclick=checkAnswer;root.querySelector('#backspace').onclick=()=>{input.value=input.value.slice(0,-1);syncBuilder();input.focus()};root.querySelector('#clear').onclick=()=>{input.value='';syncBuilder();input.focus()};root.querySelector('#hintButton').onclick=()=>{root.querySelector('#hint').hidden=false};root.querySelector('#next').onclick=()=>{current++;persist();renderTask()};
function checkAnswer(){const result=root.querySelector('#result');if(norm(input.value)===norm(t.answer)){if(!correctIds.includes(current)){correctIds.push(current);points++}result.textContent='Верно! Молодец ✨';result.className='result ok';input.disabled=true;root.querySelector('#check').disabled=true;root.querySelector('#next').classList.add('show');persist();paintProgress()}else{result.textContent='Пока не совпало. Попробуй ещё раз: можно перетаскивать знаки или нажимать на них.';result.className='result bad'}}
}
document.getElementById('reset').onclick=()=>{current=0;points=0;correctIds=[];persist();renderTask()};
renderTask();
</script></body></html>
